# Pages serves /docs from main directly, so this job only regenerates the
# metrics page when the event log changes and commits the result.
name: Metrics page

on:
  push:
    branches: [main]
    paths:
      - "docs/events.jsonl"
      - "grumpysenior/grumpy/dashboard.py"
      - "grumpysenior/grumpy/metrics.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-page
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install --quiet ./grumpysenior

      # Every record is anonymous by construction: an install id, which models
      # sat, what they agreed on, what it cost. Nothing about anyone's code is
      # in there — which is the only reason this page is allowed to be public.
      - run: grumpy dashboard --log docs/events.jsonl --out docs/index.html

      - name: Commit if the metrics changed
        run: |
          if git diff --quiet docs/index.html; then
            echo "Metrics unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Rebuild metrics page from the event log"
          git push
