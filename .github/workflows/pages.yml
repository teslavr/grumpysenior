# The Books, published. Regenerates the analytics page and deploys it to Pages.
name: The Books

on:
  push:
    branches: [main]
    paths:
      - "docs/events.jsonl"
      - "grumpysenior/grumpy/dashboard.py"
      - "grumpysenior/grumpy/metrics.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install --quiet ./grumpysenior

      # Regenerated from the committed event log. Every record is anonymous by
      # construction: an install id, which models sat, what they agreed on, what
      # it cost. Nothing about anyone's code is in there — which is the only
      # reason this page is allowed to be public.
      - run: grumpy dashboard --log docs/events.jsonl --out docs/index.html

      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }

      - id: deploy
        uses: actions/deploy-pages@v4
